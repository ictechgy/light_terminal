name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        required: true
        type: boolean
        default: true
      publish_platforms:
        description: "Build and publish platform packages before the wrapper"
        required: true
        type: boolean
        default: true
      allow_existing_platforms:
        description: "Allow non-dry-run wrapper publish without rebuilding platform packages"
        required: true
        type: boolean
        default: false
      allow_npm_token_fallback:
        description: "Expose NPM_TOKEN to publish steps instead of using trusted publishing/OIDC only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "input tag must match vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 62
          fi

  metadata:
    name: Check npm metadata
    needs: validate-inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate package versions
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "input tag must match vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 62
          fi
          actual_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          if [[ "$actual_commit" != "$tag_commit" ]]; then
            echo "checked-out commit $actual_commit does not match tag $TAG ($tag_commit)" >&2
            exit 63
          fi

          version=$(node -p 'require("./package.json").version')
          expected_tag="v${version}"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "input tag $TAG does not match package version $version" >&2
            exit 64
          fi

          node scripts/validate_npm_packages.mjs

          for dir in npm/platforms/lterm-darwin-arm64 npm/platforms/lterm-darwin-x64 npm/platforms/lterm-linux-arm64 npm/platforms/lterm-linux-x64; do
            package_version=$(node -p "require('./${dir}/package.json').version")
            if [[ "$package_version" != "$version" ]]; then
              echo "${dir} version ${package_version} does not match root version ${version}" >&2
              exit 65
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$actual_commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: metadata
    if: ${{ inputs.publish_platforms }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lterm-darwin-arm64
            target: darwin-arm64
            runner: macos-latest
          - package: lterm-darwin-x64
            target: darwin-x64
            runner: macos-15-intel
          - package: lterm-linux-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - package: lterm-linux-x64
            target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Build lterm release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          ./target/release/lterm --version
          ./target/release/lterm --help >/dev/null

      - name: Stage and dry-run pack platform package
        shell: bash
        run: |
          set -euo pipefail
          scripts/prepare-npm-platform-package.sh "${{ matrix.target }}" target/release/lterm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package }}
          path: npm/platforms/${{ matrix.package }}/bin/lterm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm packages
    needs: [metadata, build]
    if: ${{ always() && needs.metadata.result == 'success' && (!inputs.publish_platforms || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: ${{ inputs.publish_platforms }}
        with:
          path: artifacts

      - name: Stage downloaded platform binaries
        if: ${{ inputs.publish_platforms }}
        shell: bash
        run: |
          set -euo pipefail
          for package in lterm-darwin-arm64 lterm-darwin-x64 lterm-linux-arm64 lterm-linux-x64; do
            install -d "npm/platforms/${package}/bin"
            test -s "artifacts/${package}/lterm"
            install -m 0755 "artifacts/${package}/lterm" "npm/platforms/${package}/bin/lterm"
            ls -lh "npm/platforms/${package}/bin/lterm"
          done

      - name: Validate npm package graph
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ inputs.publish_platforms }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_PLATFORMS" == "true" ]]; then
            node scripts/validate_npm_packages.mjs --require-binaries
          else
            node scripts/validate_npm_packages.mjs
          fi

      - name: Show npm version
        shell: bash
        run: npm --version

      - name: Publish platform packages first
        if: ${{ inputs.publish_platforms }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ inputs.allow_npm_token_fallback && secrets.NPM_TOKEN || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          VALIDATED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          publish_flags=(--access public)
          if [[ "$DRY_RUN" == "true" ]]; then
            publish_flags+=(--dry-run)
          else
            publish_flags+=(--provenance)
            if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
              echo "NPM_TOKEN fallback is disabled or empty; npm will try trusted publishing/OIDC. This requires trusted publishers for existing packages." >&2
            fi
          fi

          for package in lterm-darwin-arm64 lterm-darwin-x64 lterm-linux-arm64 lterm-linux-x64; do
            (
              cd "npm/platforms/${package}"
              version=$(node -p 'require("./package.json").version')
              if [[ "$version" != "$VALIDATED_VERSION" ]]; then
                echo "${package} version ${version} does not match validated metadata version ${VALIDATED_VERSION}" >&2
                exit 65
              fi
              if [[ "$DRY_RUN" != "true" ]] && npm view "${package}@${version}" version >/dev/null 2>&1; then
                echo "${package}@${version} already exists; skipping publish"
                exit 0
              fi
              npm publish "${publish_flags[@]}"
            )
          done

      - name: Publish wrapper package last
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ inputs.allow_npm_token_fallback && secrets.NPM_TOKEN || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_PLATFORMS: ${{ inputs.publish_platforms }}
          VALIDATED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          publish_flags=(--access public)
          if [[ "$DRY_RUN" == "true" ]]; then
            publish_flags+=(--dry-run)
          else
            publish_flags+=(--provenance)
          fi
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [[ "$version" != "$VALIDATED_VERSION" ]]; then
            echo "${package} version ${version} does not match validated metadata version ${VALIDATED_VERSION}" >&2
            exit 65
          fi
          if [[ "$DRY_RUN" != "true" && "$PUBLISH_PLATFORMS" != "true" ]]; then
            if [[ "${{ inputs.allow_existing_platforms }}" != "true" ]]; then
              echo "non-dry-run wrapper publish requires publish_platforms=true unless allow_existing_platforms=true" >&2
              exit 67
            fi
            for platform_package in lterm-darwin-arm64 lterm-darwin-x64 lterm-linux-arm64 lterm-linux-x64; do
              if ! npm view "${platform_package}@${version}" version >/dev/null 2>&1; then
                echo "missing required platform package ${platform_package}@${version}; refusing to publish wrapper without platform build" >&2
                exit 66
              fi
            done
          fi
          if [[ "$DRY_RUN" != "true" ]] && npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "${package}@${version} already exists; skipping publish"
            exit 0
          fi
          npm publish "${publish_flags[@]}"
