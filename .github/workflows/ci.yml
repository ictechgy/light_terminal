name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_soak_release_gate:
        description: "Run the 15-minute pre-tag soak release gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust-standard-checks:
    name: rust-standard-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version
      - name: Format check
        run: cargo fmt -- --check
      - name: Release helper script tests
        run: python3 scripts/test_release_helpers.py
      - name: Quad brainstorming contract tests
        run: |
          QUAD_BRAINSTORMING_SKILL=.codex/skills/quad-brainstorming/SKILL.md \
            python3 scripts/test_quad_brainstorming_skill_contract.py
          python3 scripts/test_quad_brainstorming_json_schemas.py
          python3 scripts/test_quad_brainstorming_manifest_summary.py
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked

  g003-real-bwrap-cgroup:
    name: g003-real-bwrap-cgroup
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust and exact bubblewrap package
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          test "$(dpkg-query --search /usr/bin/bwrap)" = "bubblewrap: /usr/bin/bwrap"
          test "$(stat --format=%F /usr/bin/bwrap)" = "regular file"
          test "$(stat --format=%u /usr/bin/bwrap)" = "0"
          test "$((8#$(stat --format=%a /usr/bin/bwrap) & 8#022))" = "0"
          dpkg-query --show --showformat='bubblewrap=${Version}\n' bubblewrap
          uname --kernel-release
          rustc --version
          cargo --version
      - name: Run required real bwrap and cgroup Gate P
        env:
          LTERM_REQUIRE_REAL_BWRAP: "1"
        run: |
          set -euo pipefail
          unit="lterm-g003-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runner_subgroup="lterm-g003-runner"
          gate_script="${RUNNER_TEMP}/lterm-g003-gate.sh"
          cat >"$gate_script" <<'GATE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          current_cgroup="$(awk -F: '$1 == "0" && $2 == "" { print $3 }' /proc/self/cgroup)"
          case "$current_cgroup" in
            */lterm-g003-runner) ;;
            *)
              echo "::error::required delegated cgroup subgroup is absent" >&2
              exit 1
              ;;
          esac
          delegated_relative="${current_cgroup%/lterm-g003-runner}"
          export LTERM_G003_CGROUP_ROOT="/sys/fs/cgroup${delegated_relative}"
          test -d "$LTERM_G003_CGROUP_ROOT"
          test "$(stat --format=%u "$LTERM_G003_CGROUP_ROOT")" = "$(id -u)"

          cleanup() {
            main_status=$?
            trap - EXIT
            set +e
            cleanup_status=0
            shopt -s nullglob
            fixtures=("$LTERM_G003_CGROUP_ROOT"/lterm-g003-gate-*)
            for fixture in "${fixtures[@]}"; do
              if [[ -f "$fixture/candidate-0/cgroup.kill" ]]; then
                printf '1\n' >"$fixture/candidate-0/cgroup.kill"
                operation_status=$?
                if (( operation_status != 0 )); then
                  cleanup_status=$operation_status
                fi
              fi
              for _ in {1..500}; do
                populated=0
                if [[ -r "$fixture/candidate-0/cgroup.events" ]]; then
                  populated="$(awk '$1 == "populated" { print $2 }' "$fixture/candidate-0/cgroup.events")"
                fi
                if [[ "$populated" == "0" ]]; then
                  break
                fi
                sleep 0.01
              done
              for directory in \
                "$fixture/candidate-0/control" \
                "$fixture/candidate-0/payload" \
                "$fixture/candidate-0" \
                "$fixture"; do
                if [[ -d "$directory" ]]; then
                  rmdir "$directory" >/dev/null 2>&1
                  operation_status=$?
                  if (( operation_status != 0 )); then
                    cleanup_status=$operation_status
                  fi
                fi
              done
            done
            if (( main_status != 0 )); then
              exit "$main_status"
            fi
            if (( cleanup_status != 0 )); then
              echo "::error::delegated cgroup cleanup failed" >&2
              exit "$cleanup_status"
            fi
            exit 0
          }
          trap cleanup EXIT

          cargo test --locked --test g003_linux_feasibility \
            g003_real_bwrap_cgroup_feasibility -- \
            --exact --ignored --nocapture --test-threads=1
          GATE_SCRIPT
          chmod 0700 "$gate_script"

          sudo systemd-run \
            --quiet \
            --wait \
            --pipe \
            --collect \
            --unit "$unit" \
            --property Type=exec \
            --property "User=$(id -u)" \
            --property "Group=$(id -g)" \
            --property "WorkingDirectory=${GITHUB_WORKSPACE}" \
            --property Delegate=pids \
            --property "DelegateSubgroup=${runner_subgroup}" \
            --setenv "HOME=${HOME}" \
            --setenv "PATH=${PATH}" \
            --setenv "LTERM_REQUIRE_REAL_BWRAP=${LTERM_REQUIRE_REAL_BWRAP}" \
            /usr/bin/bash "$gate_script"

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    env:
      CARGO_AUDIT_VERSION: 0.22.1
      CARGO_AUDIT_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - name: Restore cargo-audit install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_RUNNER_IMAGE }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
      - name: Verify cargo-audit version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(cargo audit --version)"
          case "$actual" in
            *" $CARGO_AUDIT_VERSION") ;;
            *)
              echo "::error::cargo-audit version mismatch: expected $CARGO_AUDIT_VERSION, got $actual" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$actual"
      - name: Audit locked dependency graph
        run: |
          cargo audit

  contract-manifest-validate:
    name: contract-manifest-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Validate manifest validator self-test
        run: python3 scripts/validate_contract_manifest.py --self-test
      - name: Validate public contract manifest
        run: python3 scripts/validate_contract_manifest.py docs/contract-manifest.json

  json-schema-validate:
    name: json-schema-validate
    runs-on: ubuntu-latest
    needs: contract-manifest-validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build lterm for schema samples
        run: cargo build --locked
      - name: Validate stable JSON schemas
        run: python3 scripts/validate_json_schemas.py --manifest docs/contract-manifest.json --schema-dir docs/schemas --lterm-bin target/debug/lterm
      - name: Check URL contract policy self-test
        run: python3 scripts/check_url_contract_policy.py --self-test
      - name: Check URL contract policy drift
        run: python3 scripts/check_url_contract_policy.py

  contract-examples:
    name: contract-examples
    runs-on: ubuntu-latest
    needs: json-schema-validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build lterm for contract examples
        run: cargo build --locked
      - name: Run manifest-listed contract examples
        env:
          LTERM_BIN: ${{ github.workspace }}/target/debug/lterm
        run: python3 scripts/check_contract_examples.py --manifest docs/contract-manifest.json README.md docs/public-contract.md

  contract-drift-poc:
    name: contract-drift-poc
    runs-on: ubuntu-latest
    needs: contract-manifest-validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build lterm for help surface
        run: cargo build --locked
      - name: Check top-level help vs contract manifest
        run: python3 scripts/check_contract_drift.py --manifest docs/contract-manifest.json --lterm-bin target/debug/lterm

  upgrade-matrix:
    name: upgrade-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run v0.1.4 compatibility matrix
        run: cargo test --locked --test upgrade_matrix -- --include-ignored --nocapture --test-threads=1

  soak-release-gate:
    name: soak-release-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak_release_gate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run 15-minute soak profile
        run: LTERM_SOAK_DURATION=900 LTERM_SOAK_SESSIONS=16 cargo test --locked --test soak -- --ignored --nocapture --test-threads=1
