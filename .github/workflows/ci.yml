name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_soak_release_gate:
        description: "Run the 15-minute pre-tag soak release gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust-standard-checks:
    name: rust-standard-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version
      - name: Format check
        run: cargo fmt -- --check
      - name: Release helper script tests
        run: python3 scripts/test_release_helpers.py
      - name: Quad brainstorming contract tests
        run: |
          QUAD_BRAINSTORMING_SKILL=.codex/skills/quad-brainstorming/SKILL.md \
            python3 scripts/test_quad_brainstorming_skill_contract.py
          python3 scripts/test_quad_brainstorming_json_schemas.py
          python3 scripts/test_quad_brainstorming_manifest_summary.py
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    env:
      CARGO_AUDIT_VERSION: 0.22.1
      CARGO_AUDIT_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - name: Restore cargo-audit install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_RUNNER_IMAGE }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
      - name: Verify cargo-audit version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(cargo audit --version)"
          case "$actual" in
            *" $CARGO_AUDIT_VERSION") ;;
            *)
              echo "::error::cargo-audit version mismatch: expected $CARGO_AUDIT_VERSION, got $actual" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$actual"
      - name: Audit locked dependency graph
        run: |
          cargo audit

  contract-manifest-validate:
    name: contract-manifest-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Validate manifest validator self-test
        run: python3 scripts/validate_contract_manifest.py --self-test
      - name: Validate public contract manifest
        run: python3 scripts/validate_contract_manifest.py docs/contract-manifest.json

  json-schema-validate:
    name: json-schema-validate
    runs-on: ubuntu-latest
    needs: contract-manifest-validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build lterm for schema samples
        run: cargo build --locked
      - name: Validate stable JSON schemas
        run: python3 scripts/validate_json_schemas.py --manifest docs/contract-manifest.json --schema-dir docs/schemas --lterm-bin target/debug/lterm
      - name: Check URL contract policy self-test
        run: python3 scripts/check_url_contract_policy.py --self-test
      - name: Check URL contract policy drift
        run: python3 scripts/check_url_contract_policy.py

  contract-examples:
    name: contract-examples
    runs-on: ubuntu-latest
    needs: json-schema-validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build lterm for contract examples
        run: cargo build --locked
      - name: Run manifest-listed contract examples
        env:
          LTERM_BIN: ${{ github.workspace }}/target/debug/lterm
        run: python3 scripts/check_contract_examples.py --manifest docs/contract-manifest.json README.md docs/public-contract.md

  contract-drift-poc:
    name: contract-drift-poc
    runs-on: ubuntu-latest
    needs: contract-manifest-validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build lterm for help surface
        run: cargo build --locked
      - name: Check top-level help vs contract manifest
        run: python3 scripts/check_contract_drift.py --manifest docs/contract-manifest.json --lterm-bin target/debug/lterm

  upgrade-matrix:
    name: upgrade-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run v0.1.4 compatibility matrix
        run: cargo test --locked --test upgrade_matrix -- --include-ignored --nocapture --test-threads=1

  soak-release-gate:
    name: soak-release-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak_release_gate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run 15-minute soak profile
        run: LTERM_SOAK_DURATION=900 LTERM_SOAK_SESSIONS=16 cargo test --locked --test soak -- --ignored --nocapture --test-threads=1
