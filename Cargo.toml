[package]
name = "light-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight tmux-compatible terminal session daemon with cmux-friendly notifications."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["terminal", "tmux", "pty", "cmux", "multiplexer"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lterm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
